# A separate vhost for the arena relay; other sites on the server are left alone.
# The installer replaces __ARENA_DOMAIN__ and Certbot adds HTTPS afterwards.
server {
    listen 80;
    server_name __ARENA_DOMAIN__;

    location = /ws {
        proxy_pass http://127.0.0.1:5221/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
    }

    location = /health { proxy_pass http://127.0.0.1:5221/health; }
    location / { return 404; }
}
